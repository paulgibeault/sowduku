# Thin caller for the fleet CI/CD standard. The pipeline lives in the
# launcher repo (fleet-ci.yml); change it there and every app follows.
# See GAME_INTEGRATION.md §13a.
#
# This app's suites stage the launcher-and-game origin (index.html loads
# /arcade-sdk.js root-relative; the SDK persists every save), so the
# pipeline checks the launcher out in-workspace (ARCADE_LAUNCHER) and runs
# its GAME_INTEGRATION §13 acceptance after our own tests.
name: CI & Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # version_bump pushes the bump commit back to main
  pages: write
  id-token: write

# Per-ref, so a PR run never cancels main's deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    uses: paulgibeault/paulgibeault.github.io/.github/workflows/fleet-ci.yml@main
    with:
      launcher: true
      browsers: chromium webkit
      # sw.js derives CACHE from APP_VERSION, which this step rewrites.
      # Without it the cache identity freezes and returning players never
      # execute a deployed fix — the drift this repo used to hand-manage.
      version_bump: true
